name: Build APK for Newifi D2 (OpenWrt 25.12)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (leave empty for auto)'
        required: false
        default: ''
      create_release:
        description: 'Publish .apk to GitHub Releases'
        required: false
        type: boolean
        default: true
  push:
    branches:
      - main
      - master
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'build.sh'
      - 'version.txt'
      - '.github/workflows/build-newifi-d2.yml'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build OpenWrt 25.12 APK (mipsel_24kc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Install dependencies & OpenWrt 25.12 APK tool
        run: |
          sudo apt-get update
          sudo apt-get install -y upx-ucl jq curl tar gzip zstd file binutils fakeroot
          mkdir -p /tmp/owrt-host
          IB_URL="https://downloads.openwrt.org/releases/25.12.5/targets/x86/64/openwrt-imagebuilder-25.12.5-x86-64.Linux-x86_64.tar.zst"
          curl -fL "$IB_URL" | tar --zstd -x -C /tmp/owrt-host --strip-components=1 --wildcards '*/staging_dir/host/*'
          /tmp/owrt-host/staging_dir/host/bin/apk --version

      - name: Force MIPS architecture, build and pack APK v3
        run: |
          chmod +x build.sh

          # Полностью вырезаем из build.sh любые упоминания жесткого задания GOARCH (arm64/amd64/aarch64)
          sed -i -E 's/GOARCH=["'\'']?(arm64|amd64|aarch64)["'\'']?/GOARCH=mipsle/g' build.sh
          sed -i -E 's/aarch64_cortex-a53/mipsel_24kc/g' build.sh
          sed -i -E 's/aarch64_generic/mipsel_24kc/g' build.sh
          sed -i -E 's/aarch64/mipsel_24kc/g' build.sh

          # Перехватываем компилятор go, чтобы гарантировать mipsle + softfloat
          REAL_GO=$(command -v go)
          sudo tee /usr/local/bin/go >/dev/null <<EOF
          #!/usr/bin/env bash
          export CGO_ENABLED=0
          export GOOS=linux
          export GOARCH=mipsle
          export GOMIPS=softfloat
          exec "$REAL_GO" "\$@"
          EOF
          sudo chmod +x /usr/local/bin/go

          if [ -n "${{ github.event.inputs.version }}" ]; then
            ./build.sh "${{ github.event.inputs.version }}"
          else
            ./build.sh
          fi

          # Находим созданный .ipk
          IPK_FILE=$(ls build/*.ipk | head -n 1)
          if [ -z "$IPK_FILE" ]; then
            echo "ERROR: .ipk package was not generated!"
            exit 1
          fi

          # Распаковываем для проверки и конвертации в APK v3
          mkdir -p /tmp/pkg_extract /tmp/pkg_root /tmp/pkg_ctrl
          if file "$IPK_FILE" | grep -qi "ar archive"; then
            (cd /tmp/pkg_extract && ar x "$OLDPWD/$IPK_FILE")
          else
            tar -xzf "$IPK_FILE" -C /tmp/pkg_extract
          fi
          tar -xf /tmp/pkg_extract/data.tar* -C /tmp/pkg_root
          tar -xf /tmp/pkg_extract/control.tar* -C /tmp/pkg_ctrl

          # СТРОГАЯ ПРОВЕРКА: Ищем бинарник rrws и убеждаемся, что он MIPS!
          RRWS_BIN=$(find /tmp/pkg_root -name "rrws" -type f)
          if [ -z "$RRWS_BIN" ]; then
            RRWS_BIN=$(find /tmp/pkg_root -type f -executable | head -n 1)
          fi
          
          echo "Checking binary: $RRWS_BIN"
          file "$RRWS_BIN"
          file "$RRWS_BIN" | grep -qi "MIPS" || { echo "CRITICAL ERROR: Binary is NOT MIPS architecture!"; exit 1; }

          # Извлекаем версию пакета
          PKG_VER=$(sed -n 's/^Version:[[:space:]]*//p' /tmp/pkg_ctrl/control | tr -d '[:space:]')
          [ -z "$PKG_VER" ] && PKG_VER="0.3.1-r1"
          case "$PKG_VER" in
            *-r*) ;;
            *) PKG_VER="${PKG_VER}-r1" ;;
          esac

          # Собираем нативный APK v3
          rm -f build/*.apk build/*.ipk
          APK_OUT="build/luci-app-rrws_${PKG_VER}_mipsel_24kc.apk"

          SCRIPT_ARGS=""
          if [ -f /tmp/pkg_ctrl/postinst ]; then
            SCRIPT_ARGS="--script post-install:/tmp/pkg_ctrl/postinst"
          fi

          sudo chown -R 0:0 /tmp/pkg_root
          sudo /tmp/owrt-host/staging_dir/host/bin/apk mkpkg \
            --info "name:luci-app-rrws" \
            --info "version:${PKG_VER}" \
            --info "arch:mipsel_24kc" \
            --info "description:RR WARP Scanner for OpenWrt" \
            --files /tmp/pkg_root \
            $SCRIPT_ARGS \
            --output "$APK_OUT"
          sudo chown "$USER:$USER" "$APK_OUT"

          /tmp/owrt-host/staging_dir/host/bin/apk adbdump "$APK_OUT" | head -n 25
          ls -lh build/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-rrws-apk-mt7621
          path: build/*.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}-mt7621-apk
          name: "Newifi D2 (OpenWrt 25.12 APK) Build #${{ github.run_number }}"
          body: "OpenWrt 25.12 APK v3 package for D-Team Newifi D2 (ramips/mt7621, mipsel_24kc, GOMIPS=softfloat)"
          files: build/*.apk
