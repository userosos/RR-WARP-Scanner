name: Build APK for Newifi D2 (OpenWrt 25.12)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (leave empty for auto)'
        required: false
        default: ''
      create_release:
        description: 'Publish .apk to GitHub Releases'
        required: false
        type: boolean
        default: true
  push:
    branches:
      - main
      - master
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'build.sh'
      - 'version.txt'
      - '.github/workflows/build-newifi-d2.yml'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build OpenWrt 25.12 APK (mipsel_24kc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Install dependencies and OpenWrt 25.12 APK v3 tool
        run: |
          set +o pipefail
          sudo apt-get update
          sudo apt-get install -y upx-ucl jq curl tar gzip zstd file binutils
          mkdir -p /tmp/owrt-host
          IB_URL="https://downloads.openwrt.org/releases/25.12.5/targets/x86/64/openwrt-imagebuilder-25.12.5-x86-64.Linux-x86_64.tar.zst"
          curl -fL "$IB_URL" | tar --zstd -x -C /tmp/owrt-host --strip-components=1 --wildcards '*/staging_dir/host/*'
          /tmp/owrt-host/staging_dir/host/bin/apk --version

      - name: Compile for MT7621 (mipsle softfloat) and build APK v3
        run: |
          set +o pipefail
          REAL_GO=$(command -v go)
          sudo tee /usr/local/bin/go >/dev/null <<EOF
          #!/usr/bin/env bash
          export CGO_ENABLED=0
          export GOOS=linux
          export GOARCH=mipsle
          export GOMIPS=softfloat
          exec "$REAL_GO" "\$@"
          EOF
          sudo chmod +x /usr/local/bin/go
          chmod +x build.sh
          sed -i 's/GOARCH=arm64/GOARCH=mipsle GOMIPS=softfloat/g' build.sh || true
          if [ -n "${{ github.event.inputs.version }}" ]; then
            ./build.sh "${{ github.event.inputs.version }}"
          else
            ./build.sh
          fi
          IPK_FILE=$(ls build/*.ipk | head -n 1)
          if [ -z "$IPK_FILE" ]; then
            echo "ERROR: .ipk was not generated by build.sh"
            exit 1
          fi
          mkdir -p /tmp/pkg_extract /tmp/pkg_root /tmp/pkg_ctrl
          if file "$IPK_FILE" | grep -qi "ar archive"; then
            (cd /tmp/pkg_extract && ar x "$OLDPWD/$IPK_FILE")
          else
            tar -xzf "$IPK_FILE" -C /tmp/pkg_extract
          fi
          tar -xf /tmp/pkg_extract/data.tar* -C /tmp/pkg_root
          tar -xf /tmp/pkg_extract/control.tar* -C /tmp/pkg_ctrl
          PKG_VER=$(sed -n 's/^Version:[[:space:]]*//p' /tmp/pkg_ctrl/control | tr -d '[:space:]')
          if [ -z "$PKG_VER" ]; then
            PKG_VER="0.3.1-r1"
          fi
          case "$PKG_VER" in
            *-r*) ;;
            *) PKG_VER="${PKG_VER}-r1" ;;
          esac
          echo "Detected package version: $PKG_VER"
          ELF_FOUND=0
          while IFS= read -r f; do
            if file "$f" | grep -q "ELF"; then
              file "$f"
              ELF_FOUND=1
              if ! file "$f" | grep -qi "MIPS"; then
                echo "ERROR: ELF binary $f is not MIPS!"
                exit 1
              fi
            fi
          done < <(find /tmp/pkg_root -type f)
          if [ "$ELF_FOUND" -eq 0 ]; then
            echo "WARNING: No ELF binary found in package root"
          fi
          rm -f build/*.apk build/*.ipk
          APK_OUT="build/luci-app-rrws_${PKG_VER}_mipsel_24kc.apk"
          sudo chown -R 0:0 /tmp/pkg_root
          sudo /tmp/owrt-host/staging_dir/host/bin/apk mkpkg \
            --info "name:luci-app-rrws" \
            --info "version:${PKG_VER}" \
            --info "arch:mipsel_24kc" \
            --info "description:RR WARP Scanner for OpenWrt" \
            --files /tmp/pkg_root \
            --output "$APK_OUT"
          sudo chown "$USER:$USER" "$APK_OUT"
          /tmp/owrt-host/staging_dir/host/bin/apk adbdump "$APK_OUT" | head -n 25
          ls -lh build/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-rrws-apk-mt7621
          path: build/*.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}-mt7621-apk
          name: "Newifi D2 (OpenWrt 25.12 APK) Build #${{ github.run_number }}"
          body: "OpenWrt 25.12 APK v3 package for D-Team Newifi D2 (ramips/mt7621, mipsel_24kc, GOMIPS=softfloat)"
          files: build/*.apk
