name: Build APK for Newifi D2 (OpenWrt 25.12)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия пакета (оставьте пустым для автоверсии из version.txt)'
        required: false
        default: ''
      create_release:
        description: 'Опубликовать .apk в GitHub Releases'
        required: false
        type: boolean
        default: true
  push:
    branches:
      - main
      - master
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'build.sh'
      - 'version.txt'
      - '.github/workflows/build-newifi-d2.yml'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build OpenWrt 25.12 APK (mipsel_24kc)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Install OpenWrt 25.12.5 apk-tools (v3) and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y upx-ucl jq curl tar gzip zstd file fakeroot

          # Скачиваем официальный хост-пакет apk v3 из OpenWrt 25.12.5
          IB_URL="https://downloads.openwrt.org/releases/25.12.5/targets/ramips/mt7621/openwrt-imagebuilder-25.12.5-ramips-mt7621.Linux-x86_64.tar.zst"
          mkdir -p /opt/owrt-host
          curl -fL "$IB_URL" | tar --zstd -x -C /opt/owrt-host --strip-components=1 --wildcards '*/staging_dir/host/*'

          # Добавляем хост-утилиты OpenWrt (включая apk) в PATH с сохранением RPATH до ../lib
          echo "/opt/owrt-host/staging_dir/host/bin" >> $GITHUB_PATH
          sudo ln -sf /opt/owrt-host/staging_dir/host/bin/apk /usr/local/bin/apk
          /opt/owrt-host/staging_dir/host/bin/apk --version

      - name: Patch build.sh for ramips/mt7621 (mipsle + softfloat)
