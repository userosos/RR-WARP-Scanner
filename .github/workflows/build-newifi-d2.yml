- name: Direct Go compilation for MT7621 and APK v3 packaging
        run: |
          PKG_VER="${{ github.event.inputs.version }}"
          if [ -z "$PKG_VER" ] && [ -f version.txt ]; then
            PKG_VER=$(cat version.txt | tr -d '[:space:]')
          fi
          [ -z "$PKG_VER" ] && PKG_VER="0.3.1"
          PKG_FULL_VER="${PKG_VER}-r1"

          echo "Target version: $PKG_FULL_VER"

          # Ищем папку, где лежит main.go
          MAIN_DIR=$(find . -name "main.go" -exec dirname {} \; | head -n 1)
          [ -z "$MAIN_DIR" ] && MAIN_DIR="."
          echo "Found main.go in: $MAIN_DIR"

          export CGO_ENABLED=0
          export GOOS=linux
          export GOARCH=mipsle
          export GOMIPS=softfloat

          echo "Compiling Go binary for linux/mipsle (GOMIPS=softfloat)..."
          (cd "$MAIN_DIR" && go build -ldflags="-s -w" -o "$GITHUB_WORKSPACE/rrws" .)
          
          if command -v upx >/dev/null 2>&1; then
            upx --best --lzma rrws || true
          fi

          file rrws
          file rrws | grep -qi "MIPS" || { echo "CRITICAL ERROR: Compiled binary is not MIPS!"; exit 1; }

          # Подготовка дерева каталогов пакета
          mkdir -p pkg_root/usr/bin pkg_root/usr/lib/lua/luci/controller pkg_root/usr/lib/lua/luci/view pkg_root/etc/init.d pkg_root/etc/uci-defaults

          cp rrws pkg_root/usr/bin/rrws
          chmod +x pkg_root/usr/bin/rrws

          # Копируем структуру файлов из корня репозитория (кроме служебных)
          for d in usr etc root lib www luci; do
            if [ -d "$d" ]; then
              cp -r "$d"/* pkg_root/ 2>/dev/null || true
            fi
          done

          # Контрольное копирование бинарника на случай перезаписи
          cp -f rrws pkg_root/usr/bin/rrws
          chmod +x pkg_root/usr/bin/rrws

          mkdir -p build
          APK_OUT="build/luci-app-rrws_${PKG_FULL_VER}_mipsel_24kc.apk"

          sudo chown -R 0:0 pkg_root
          sudo /tmp/owrt-host/staging_dir/host/bin/apk mkpkg \
            --info "name:luci-app-rrws" \
            --info "version:${PKG_FULL_VER}" \
            --info "arch:mipsel_24kc" \
            --info "description:RR WARP Scanner for OpenWrt LuCI" \
            --files pkg_root \
            --output "$APK_OUT"
          sudo chown "$USER:$USER" "$APK_OUT"

          /tmp/owrt-host/staging_dir/host/bin/apk adbdump "$APK_OUT" | head -n 25
          ls -lh build/
