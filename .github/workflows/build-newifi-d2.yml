name: Build APK for Newifi D2 (OpenWrt 25.12)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 0.3.1)'
        required: false
        default: '0.3.1'
      create_release:
        description: 'Publish .apk to GitHub Releases'
        required: false
        type: boolean
        default: true
  push:
    branches:
      - main
      - master
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'build.sh'
      - 'version.txt'
      - '.github/workflows/build-newifi-d2.yml'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build OpenWrt 25.12 APK (mipsel_24kc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Install dependencies & OpenWrt APK tool
        run: |
          sudo apt-get update
          sudo apt-get install -y upx-ucl jq curl tar gzip zstd file binutils fakeroot
          mkdir -p /tmp/owrt-host
          IB_URL="https://downloads.openwrt.org/releases/25.12.5/targets/x86/64/openwrt-imagebuilder-25.12.5-x86-64.Linux-x86_64.tar.zst"
          curl -fL "$IB_URL" | tar --zstd -x -C /tmp/owrt-host --strip-components=1 --wildcards '*/staging_dir/host/*'
          /tmp/owrt-host/staging_dir/host/bin/apk --version

      - name: Compile MIPS binary, run build.sh and package APK v3
        run: |
          PKG_VER="${{ github.event.inputs.version }}"
          if [ -z "$PKG_VER" ] && [ -f version.txt ]; then
            PKG_VER=$(cat version.txt | tr -d '[:space:]')
          fi
          [ -z "$PKG_VER" ] && PKG_VER="0.3.1"
          PKG_FULL_VER="${PKG_VER}-r1"

          # 1. Компилируем чистый бинарник под MIPS (softfloat)
          export CGO_ENABLED=0
          export GOOS=linux
          export GOARCH=mipsle
          export GOMIPS=softfloat

          if [ -f "go.mod" ]; then
            go build -ldflags="-s -w" -o rrws .
          else
            MOD_DIR=$(find . -name "go.mod" -exec dirname {} \; | head -n 1)
            [ -z "$MOD_DIR" ] && MOD_DIR="."
            (cd "$MOD_DIR" && go build -ldflags="-s -w" -o "$GITHUB_WORKSPACE/rrws" .)
          fi

          file rrws
          file rrws | grep -qi "MIPS" || { echo "CRITICAL ERROR: Compiled binary is not MIPS!"; exit 1; }

          # 2. Запускаем оригинальный build.sh, чтобы он подготовил структуру и .ipk
          chmod +x build.sh
          ./build.sh both || ./build.sh || true

          # 3. Ищем созданный .ipk или собираем структуру из исходников
          IPK_FILE=$(ls build/*.ipk 2>/dev/null | head -n 1)
          
          mkdir -p /tmp/pkg_root /tmp/pkg_ctrl
          if [ -n "$IPK_FILE" ]; then
            mkdir -p /tmp/pkg_extract
            if file "$IPK_FILE" | grep -qi "ar archive"; then
              (cd /tmp/pkg_extract && ar x "$OLDPWD/$IPK_FILE")
            else
              tar -xzf "$IPK_FILE" -C /tmp/pkg_extract
            fi
            tar -xf /tmp/pkg_extract/data.tar* -C /tmp/pkg_root
            tar -xf /tmp/pkg_extract/control.tar* -C /tmp/pkg_ctrl
          else
            # Резервный сборщик структуры, если ipk не собрался
            mkdir -p /tmp/pkg_root/usr/bin /tmp/pkg_root/usr/lib/lua/luci/controller /tmp/pkg_root/usr/lib/lua/luci/view /tmp/pkg_root/etc/init.d /tmp/pkg_root/etc/uci-defaults
            for d in usr etc root lib www luci; do
              [ -d "$d" ] && cp -r "$d"/* /tmp/pkg_root/ 2>/dev/null || true
            done
          fi

          # 4. Подменяем бинарник внутри структуры на нашу рабочую MIPS-версию
          find /tmp/pkg_root -name "rrws" -type f -exec cp -f rrws {} \;
          # Если точного файла не нашлось, кладем в /usr/bin/rrws
          mkdir -p /tmp/pkg_root/usr/bin
          cp -f rrws /tmp/pkg_root/usr/bin/rrws
          chmod +x /tmp/pkg_root/usr/bin/rrws

          # Версия пакета
          if [ -f /tmp/pkg_ctrl/control ]; then
            EXT_VER=$(sed -n 's/^Version:[[:space:]]*//p' /tmp/pkg_ctrl/control | tr -d '[:space:]')
            [ -n "$EXT_VER" ] && PKG_FULL_VER="$EXT_VER"
          fi
          case "$PKG_FULL_VER" in
            *-r*) ;;
            *) PKG_FULL_VER="${PKG_FULL_VER}-r1" ;;
          esac

          # 5. Собираем нативный APK v3
          rm -f build/*.apk build/*.ipk
          mkdir -p build
          APK_OUT="build/luci-app-rrws_${PKG_FULL_VER}_mipsel_24kc.apk"

          SCRIPT_ARGS=""
          if [ -f /tmp/pkg_ctrl/postinst ]; then
            SCRIPT_ARGS="--script post-install:/tmp/pkg_ctrl/postinst"
          fi

          sudo chown -R 0:0 /tmp/pkg_root
          sudo /tmp/owrt-host/staging_dir/host/bin/apk mkpkg \
            --info "name:luci-app-rrws" \
            --info "version:${PKG_FULL_VER}" \
            --info "arch:mipsel_24kc" \
            --info "description:RR WARP Scanner for OpenWrt LuCI" \
            --files /tmp/pkg_root \
            $SCRIPT_ARGS \
            --output "$APK_OUT"
          sudo chown "$USER:$USER" "$APK_OUT"

          /tmp/owrt-host/staging_dir/host/bin/apk adbdump "$APK_OUT" | head -n 25
          ls -lh build/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-rrws-apk-mt7621
          path: build/*.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}-mt7621-apk
          name: "Newifi D2 (OpenWrt 25.12 APK) Build #${{ github.run_number }}"
          body: "OpenWrt 25.12 APK v3 package for D-Team Newifi D2 (ramips/mt7621, mipsel_24kc, GOMIPS=softfloat)"
          files: build/*.apk
