name: Build APK for Newifi D2 (OpenWrt 25.12)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 0.3.1)'
        required: false
        default: '0.3.1'
      create_release:
        description: 'Publish .apk to GitHub Releases'
        required: false
        type: boolean
        default: true
  push:
    branches:
      - main
      - master
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'version.txt'
      - '.github/workflows/build-newifi-d2.yml'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build OpenWrt 25.12 APK (mipsel_24kc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Install dependencies & OpenWrt APK tool
        run: |
          sudo apt-get update
          sudo apt-get install -y upx-ucl jq curl tar gzip zstd file binutils fakeroot
          mkdir -p /tmp/owrt-host
          IB_URL="https://downloads.openwrt.org/releases/25.12.5/targets/x86/64/openwrt-imagebuilder-25.12.5-x86-64.Linux-x86_64.tar.zst"
          curl -fL "$IB_URL" | tar --zstd -x -C /tmp/owrt-host --strip-components=1 --wildcards '*/staging_dir/host/*'
          /tmp/owrt-host/staging_dir/host/bin/apk --version

      - name: Direct Go compilation for MT7621 and APK v3 packaging
        run: |
          # Читаем версию
          PKG_VER="${{ github.event.inputs.version }}"
          if [ -z "$PKG_VER" ] && [ -f version.txt ]; then
            PKG_VER=$(cat version.txt | tr -d '[:space:]')
          fi
          [ -z "$PKG_VER" ] && PKG_VER="0.3.1"
          PKG_FULL_VER="${PKG_VER}-r1"

          echo "Target version: $PKG_FULL_VER"

          # СТРОГАЯ КОМПИЛЯЦИЯ ГО ПОД MIPSLE SOFTFLOAT
          export CGO_ENABLED=0
          export GOOS=linux
          export GOARCH=mipsle
          export GOMIPS=softfloat

          echo "Compiling Go binary for linux/mipsle (GOMIPS=softfloat)..."
          go build -ldflags="-s -w" -o rrws .
          
          if command -v upx >/dev/null 2>&1; then
            upx --best --lzma rrws || true
          fi

          # Проверка архитектуры полученного бинарника
          file rrws
          file rrws | grep -qi "MIPS" || { echo "CRITICAL ERROR: Compiled binary is not MIPS!"; exit 1; }

          # Подготовка дерева каталогов пакета
          mkdir -p pkg_root/usr/bin pkg_root/usr/lib/lua/luci/controller pkg_root/usr/lib/lua/luci/view pkg_root/etc/init.d pkg_root/etc/uci-defaults

          cp rrws pkg_root/usr/bin/rrws
          chmod +x pkg_root/usr/bin/rrws

          # Копирование LuCI-файлов, если они есть в репозитории
          if [ -d "root" ]; then
            cp -r root/* pkg_root/ 2>/dev/null || true
          fi
          if [ -d "luci" ]; then
            cp -r luci/* pkg_root/ 2>/dev/null || true
          fi

          # Если в корне есть стандартные папки OpenWrt (usr, etc)
          for d in usr etc root lib; do
            if [ -d "$d" ] && [ "$d" != "pkg_root" ]; then
              # Копируем содержимое, кроме служебных
              cp -rn "$d"/* pkg_root/ 2>/dev/null || true
            fi
          done

          # Убеждаемся, что бинарник на месте и имеет верный путь
          cp -f rrws pkg_root/usr/bin/rrws
          chmod +x pkg_root/usr/bin/rrws

          # Сборка нативного APK v3
          mkdir -p build
          APK_OUT="build/luci-app-rrws_${PKG_FULL_VER}_mipsel_24kc.apk"

          sudo chown -R 0:0 pkg_root
          sudo /tmp/owrt-host/staging_dir/host/bin/apk mkpkg \
            --info "name:luci-app-rrws" \
            --info "version:${PKG_FULL_VER}" \
            --info "arch:mipsel_24kc" \
            --info "description:RR WARP Scanner for OpenWrt LuCI" \
            --files pkg_root \
            --output "$APK_OUT"
          sudo chown "$USER:$USER" "$APK_OUT"

          /tmp/owrt-host/staging_dir/host/bin/apk adbdump "$APK_OUT" | head -n 25
          ls -lh build/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-rrws-apk-mt7621
          path: build/*.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}-mt7621-apk
          name: "Newifi D2 (OpenWrt 25.12 APK) Build #${{ github.run_number }}"
          body: "OpenWrt 25.12 APK v3 package for D-Team Newifi D2 (ramips/mt7621, mipsel_24kc, GOMIPS=softfloat)"
          files: build/*.apk
